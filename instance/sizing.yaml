# Function-point auto-estimate coefficients (engine/estimator.py).
#
# The framework ships THIS FILE EMPTY by default — sizing coefficients
# encode methodology choices (which IFPUG / COSMIC approximation, how to
# weight specced vs unspecced work, etc.). Populate per your project's
# sizing convention.
#
# When `coefficients: {}`, `mcp__sem_ai_engine__estimate_size()` returns
# value=0 with `method: auto` and an empty breakdown. Use a manual figure
# in the release node's `## Sizing` section as the authoritative source;
# the engine respects that override regardless of these coefficients.
#
# Example (uncomment + adjust):
#
# unit: function-points
# coefficients:
#   fp_per_spec: 4
#   fp_per_unspecced_feature: 8
#   fp_per_data_adr: 10

unit: function-points
coefficients: {}
