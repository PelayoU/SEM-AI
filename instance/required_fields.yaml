# Type-specific regex markers the validator checks. Each rule is warn-level:
# if the pattern does not appear in the body, the validator surfaces a hint.
#
# The framework ships THIS FILE EMPTY by default — required-field regexes
# encode methodology opinions (e.g., "a goal must have SMART letters",
# "a feature must show INVEST", "a spec must show AC numbering + Gherkin
# keywords", "an ADR must show all 7 fundamental topics"). Populate per
# your project's school.
#
# When this file is empty, validators iterate over nothing — no warnings
# emitted. Structural validators (parent-type, section-presence per
# node_types.yaml, lifecycle, jurisdiction) continue to enforce.
#
# Example structure (uncomment + adjust per your methodology):
#
# goal:
#   - name: smart-letters
#     pattern: '\bS\b.*\bM\b.*\bA\b.*\bR\b.*\bT\b'
#     hint: "goal needs explicit SMART check (S/M/A/R/T per letter)"
#
# feature:
#   - name: invest-letters
#     pattern: '\bI\b.*\bN\b.*\bV\b.*\bE\b.*\bS\b.*\bT\b'
#     hint: "feature/story needs explicit INVEST check"
#   - name: story-format
#     pattern: 'As\s+an?\s+\w+,?\s+I\s+want\s+\S+'
#     hint: "story format: 'As a [role], I want [capability], so that [benefit]'"
#
# spec:
#   - name: ac-numbering
#     pattern: '\bAC-A?\d+\b'
#     hint: "spec needs numbered ACs (AC-A1, AC-A2, …)"
#   - name: gherkin-keywords
#     pattern: '\b(Given|When|Then)\b'
#     hint: "spec needs Gherkin scenarios"
