# Role × node-type write authority matrix. Mirrors engine/jurisdiction.py::ROLE_PERMISSIONS.
#
# can_create: node types this role may create_node / supersede
# can_update: node types this role may update_node without warning
# advisory_update: node types this role MAY update_node but with an advisory warning
#                  (security-officer's contribution surface: ADR / spec / release sections)

product-manager:
  can_create: [vision, goal, capability, feature, story, spec, release]
  can_update: [vision, goal, capability, feature, story, spec, release]
  advisory_update: []

architect:
  can_create: [adr]
  can_update: [adr]
  advisory_update: []

developer:
  can_create: [defect]
  can_update: [defect]
  advisory_update: []

qa:
  can_create: [measurement, inspection, defect]
  can_update: [measurement, inspection, defect]
  advisory_update: []

devops:
  can_create: []
  can_update: []
  advisory_update: [release]   # operational sections of the release node

security-officer:
  can_create: [defect]         # security defects (Origin: security)
  can_update: [defect]
  advisory_update: [adr, spec, release]   # security-attributes / Security AC / Security gate sections

# Advisory: node type → the owning skill, for backward compatibility with v0.1
# skill names. The agent.md absorption (Day 1.9) supersedes per-skill ownership;
# this field stays only so old verify scripts can still resolve type→skill.
owning_skill:
  vision: product-manager-vision
  goal: product-manager-goals
  capability: product-manager-capabilities
  feature: product-manager-feature-decomposition
  story: product-manager-feature-decomposition
  spec: product-manager-spec-gherkin
  release: product-manager-project-planning
  adr: architect-architecture-design
  measurement: qa-measurements
  inspection: qa-inspections-program
  defect: qa-inspections-program
