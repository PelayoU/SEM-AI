# Forbidden body patterns (warn-level) the engine's validators apply.
#
# The framework ships THIS FILE EMPTY by default — forbidden patterns
# encode methodology opinions (e.g., "LOC is a forbidden primary metric",
# "OKR vocabulary is forbidden in goals"), not framework structure.
# Populate per your project's school.
#
# When `rules: []` and `security_content_pattern: ''`, the engine's
# warn-level validators iterate over nothing and return no warnings.
# The structural validators (parent-type, sections per node_types.yaml,
# lifecycle, jurisdiction) continue to enforce.

rules: []
# Example structure:
#
# rules:
#   - id: loc-as-primary-metric
#     pattern: '\b(lines\s+of\s+code|LOC)\b(?!.*secondary)'
#     scope: [goal, capability, release]
#     message: "LOC as primary size / productivity / quality metric is forbidden — use function points."
#     source: <your bibliography pointer>
#
#   - id: okr-vocab-in-goal
#     pattern: '\b(OKR|objectives?\s+and\s+key\s+results?)\b'
#     scope: [goal]
#     message: "This project uses SMART for goals; surface OKR usage as a gap."
#     source: <your bibliography pointer>


# Security cross-section detector. If a node body contains text matching
# `security_content_pattern`, validators expect the type's security section
# (per `security_section_per_type`) to be populated OR explicitly marked
# `N/A — <reason>`. Empty pattern = no security cross-section enforcement.
security_content_pattern: ''
security_section_per_type: {}
# Example:
#
# security_content_pattern: '\b(auth(?:entication|orization)?|crypto|encryption|input\s+validation|OAuth|JWT)\b'
# security_section_per_type:
#   spec: Security AC
#   release: Security gate
#   adr: Security attributes
