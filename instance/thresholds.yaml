# Numerical thresholds the engine exposes via mcp__sem_ai_engine__get_instance_config.
# The agent consults them when applying its methodology (e.g., "the FP tier band
# for this project is …", "the DRE safe minimum is …").
#
# The framework ships THIS FILE EMPTY by default — these numbers are part of
# your project's methodology, not part of the framework. Populate per your
# project's school (Capers Jones if Jones-flavored, SAFe values if SAFe,
# OKR-aligned bands if OKRs, etc.).
#
# When this file is empty:
#   - get_instance_config returns thresholds: {} — agents fall back to the
#     methodology embedded in their training, or to project skills.
#   - the engine continues to enforce structural rules (parent-type,
#     jurisdiction, lifecycle, section presence) unchanged.
#
# Example shape (uncomment + adjust):
#
# dre:
#   safe_min_pct: 95
#   leader_pct: 97
#   industry_leader_pct: 99
#   us_average_pct: 85
#   post_release_window_days: 90
#
# fagan:
#   participants_min: 3
#   participants_max: 6
#   participants_modal: 4
#
# arch_tier:
#   light_max_fp: 1000
#   important_min_fp: 10000
#   critical_min_fp: 100000
#   enterprise_min_fp: 1000000
#
# sqa:
#   mandatory_min_fp: 2500
#   staff_ratio_min_pct: 1.0
#   staff_ratio_typical_max_pct: 3.0
#
# churn:
#   min_pct_per_month: 0.5
#   max_pct_per_month: 3.0
#
# change_control:
#   cr_re_estimation_trigger_fp: 10
