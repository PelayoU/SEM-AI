# Node types — the 11 types this SEM-AI instance enforces.
#
# Each entry declares:
#   - parent: legal parent type(s), "none" (root), or "any" (cross-axis)
#   - storage: where the node lives (sem-ai/<folder>/, docs/adr/, or github-issue/release)
#   - sections: required body section headers, in canonical order
#   - summary_section: which section the project map shows as the node's "surface"
#   - owning_role: who can create + update (advisory; full matrix in jurisdiction.yaml)

vision:
  parent: none
  storage: sem-ai/vision/
  summary_section: One-breath narrative
  owning_role: product-manager
  sections:
    - Why
    - The future as a socio-technical system
    - The future product story
    - One-breath narrative
    - Positioning statement
    - Horizon
    - Adopted trends

goal:
  parent: [vision]
  storage: sem-ai/goals/
  summary_section: Outcome statement
  owning_role: product-manager
  sections:
    - Outcome statement
    - Parent vision
    - Horizon
    - SMART check
    - Why-stack

capability:
  parent: [goal]
  storage: sem-ai/capabilities/
  summary_section: Statement
  owning_role: product-manager
  sections:
    - Statement
    - Parent goal
    - Two implementations
    - Value analysis
    - Risks
    - Go / No-Go
    - Feature decomposition

feature:
  parent: [capability]
  storage: sem-ai/features/    # day-3 may migrate to github-issue
  summary_section: Story
  owning_role: product-manager
  sections:
    - Story
    - Conditions of satisfaction
    - INVEST check
    - Story-map position
    - 5 Cs status
    - Requirements detail
    - Spec

story:
  parent: [feature]
  storage: github-issue        # operational tier (Day 3 lights it up)
  summary_section: Story
  owning_role: product-manager
  sections:
    - Story
    - Conditions of satisfaction
    - INVEST check
    - Story-map position
    - 5 Cs status
    - Requirements detail
    - Spec

spec:
  parent: [feature]
  storage: github-issue
  summary_section: Summary
  owning_role: product-manager
  sections:
    - Summary
    - Acceptance Criteria
    - Security AC            # mandatory-with-N/A; dispatched to security-officer
    - Gherkin
    - Story → AC traceability

release:
  parent: [vision]
  storage: github-release
  summary_section: Summary
  owning_role: product-manager
  sections:
    - Summary
    - Scope
    - Sizing
    - Estimate
    - Plan
    - Risk register
    - Change control
    - User-involvement plan
    - Milestone tracking
    - Security gate          # mandatory-with-N/A; dispatched to security-officer
    - Benchmarks / baselines

adr:
  parent: any                 # a decision attaches to any node whose scope it serves
  storage: docs/adr/
  summary_section: Decision
  owning_role: architect
  sections:
    - Context & forces
    - Decision
    - Overall structure
    - Data structure
    - Interfaces to the outside world
    - Decomposition into functional components
    - Linkage / information transmission
    - Performance attributes
    - Security attributes    # dispatched to security-officer; topic 7 of 7
    - "Style: chosen + rejected"
    - Zachman 6×6
    - Design notation
    - Pattern reuse
    - Consequences
    - Design inspection

measurement:
  parent: [release]
  storage: github-issue
  summary_section: Summary
  owning_role: qa
  sections:
    - Summary
    - Period
    - Measure-type
    - Value-and-unit
    - Source
    - Threshold-vs-actual

inspection:
  parent: [spec, story, adr, feature, release]
  storage: github-issue
  summary_section: Summary
  owning_role: qa
  sections:
    - Summary
    - Inspection-class
    - Participants
    - DRE-percent-per-pass
    - Defects-found-by-severity
    - Action-items

defect:
  parent: [spec, story]
  storage: github-issue
  summary_section: Summary
  owning_role: qa             # qa for inspection-found; developer also writes for static-analysis/unit-test (see jurisdiction.yaml)
  sections:
    - Summary
    - Origin
    - Severity
    - Found-by
    - Status
    - Fix-commit-sha
