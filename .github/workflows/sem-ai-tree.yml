name: SEM-AI tree refresh

# Regenerate TREE.md (cascade view of the spine) on every push to main.
# Commits back with [skip ci] tag to avoid recursion. Failures are
# never fatal — the spine is correct even when TREE.md is stale.

on:
  push:
    branches: [main]
    paths:
      - 'sem-ai/**.md'
      - 'docs/adr/**.md'
      - 'instance/**.yaml'
      - 'engine/tree_renderer.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install engine dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PyYAML mistune

      - name: Regenerate TREE.md
        env:
          SEM_AI_ROOT: ${{ github.workspace }}
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python - <<'PY'
          from pathlib import Path
          from engine.config_loader import load_instance
          from engine.tree_renderer import write_tree
          inst = load_instance(Path.cwd())
          out = write_tree(inst)
          print(f"wrote {out}")
          PY

      - name: Commit TREE.md if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet TREE.md; then
            echo "TREE.md unchanged — no commit"
          else
            git add TREE.md
            git commit -m "tree(auto): refresh TREE.md from spine [skip ci]"
            git push
          fi
