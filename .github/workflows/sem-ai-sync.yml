name: SEM-AI sync features

# Regenerate the `## Features` auto-section on each capability file by
# listing GitHub Issues labelled `cap:<NN-slug>`. Idempotent: triggered
# on issue events + on push to sem-ai/capabilities/. The auto-section is
# wrapped in BEGIN/END markers so hand-written content above and below
# is preserved.

on:
  issues:
    types: [opened, closed, labeled, unlabeled, reopened, edited]
  push:
    branches: [main]
    paths:
      - 'sem-ai/capabilities/**.md'
  workflow_dispatch:

permissions:
  contents: write
  issues: read

jobs:
  sync:
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install PyYAML

      - name: Sync `## Features` sections from GitHub Issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import subprocess
          from pathlib import Path

          BEGIN = "<!-- sem-ai:auto-features:begin -->"
          END = "<!-- sem-ai:auto-features:end -->"
          repo = os.environ["REPO"]

          for cap_file in sorted(Path("sem-ai/capabilities").glob("*.md")):
              cap_slug = cap_file.stem  # e.g. "01-vision-to-code-audit"
              # Find issues labelled cap:<slug>.
              try:
                  out = subprocess.check_output(
                      ["gh", "issue", "list", "-R", repo,
                       "--label", f"cap:{cap_slug}",
                       "--state", "all",
                       "--json", "number,title,state,labels"],
                      timeout=30,
                  ).decode()
                  issues = json.loads(out or "[]")
              except subprocess.CalledProcessError:
                  issues = []

              lines = [BEGIN, "## Features", "",
                       "> Auto-synced from GitHub Issues labelled "
                       f"`cap:{cap_slug}` by `.github/workflows/sem-ai-sync.yml`. "
                       "Edit the issues to change this list — manual edits will be overwritten."]
              if not issues:
                  lines.append("")
                  lines.append("_No features yet — open a GitHub Issue with label "
                               f"`cap:{cap_slug}` to attach one._")
              else:
                  lines.append("")
                  for i in sorted(issues, key=lambda x: x["number"]):
                      state_icon = "✓" if i["state"] == "CLOSED" else "○"
                      lines.append(f"- {state_icon} #{i['number']} — {i['title']}")
              lines.append(END)
              block = "\n".join(lines) + "\n"

              text = cap_file.read_text(encoding="utf-8")
              if BEGIN in text and END in text:
                  pattern = re.compile(f"{re.escape(BEGIN)}.*?{re.escape(END)}\\n?", re.DOTALL)
                  new_text = pattern.sub(block, text)
              else:
                  new_text = text.rstrip() + "\n\n" + block
              if new_text != text:
                  cap_file.write_text(new_text, encoding="utf-8")
                  print(f"updated {cap_file}")
          PY

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet sem-ai/capabilities/; then
            echo "No capability ## Features sections changed"
          else
            git add sem-ai/capabilities/
            git commit -m "sync(auto): refresh ## Features from GitHub Issues [skip ci]"
            git push
          fi
