name: Feature
description: Open a feature under an existing capability. PM-owned.
title: "[Feature] "
labels: ["type:feature"]
body:
  - type: markdown
    attributes:
      value: |
        Open this issue once a capability is decided. The PM authors the body; the
        engine MCP's `create_node type=feature` is the alternative authoring path.
  - type: input
    id: parent_capability
    attributes:
      label: Parent capability slug
      description: e.g. `03-apply-po-discipline` — must already exist under `sem-ai/capabilities/`.
      placeholder: NN-slug
    validations:
      required: true
  - type: textarea
    id: story
    attributes:
      label: Story
      description: |
        Format — *As [role], I want [capability], so that [benefit]*.
      placeholder: As a …, I want …, so that …
    validations:
      required: true
  - type: textarea
    id: cos
    attributes:
      label: Conditions of satisfaction
      description: Bullet list (the inspectable contract).
      placeholder: |
        - …
        - …
    validations:
      required: true
  - type: textarea
    id: invest
    attributes:
      label: INVEST check
      description: One line per letter (I/N/V/E/S/T).
    validations:
      required: true
