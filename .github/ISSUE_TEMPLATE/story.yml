name: Story
description: Open a story under an existing feature.
title: "[Story] "
labels: ["type:story"]
body:
  - type: input
    id: parent_feature
    attributes:
      label: Parent feature slug
      placeholder: feature-NNN-slug
    validations:
      required: true
  - type: textarea
    id: story
    attributes:
      label: Story
      placeholder: As a …, I want …, so that …
    validations:
      required: true
  - type: textarea
    id: cos
    attributes:
      label: Conditions of satisfaction
    validations:
      required: true
  - type: textarea
    id: invest
    attributes:
      label: INVEST check
    validations:
      required: true
