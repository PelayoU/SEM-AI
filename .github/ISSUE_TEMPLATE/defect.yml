name: Defect
description: Open a defect. Authored by QA (inspection-found) or Developer (static-analysis / unit-test).
title: "[Defect] "
labels: ["type:defect"]
body:
  - type: input
    id: parent_spec_or_story
    attributes:
      label: Parent spec or story slug
      placeholder: spec-NNN-slug | story-NNN-slug
    validations:
      required: true
  - type: dropdown
    id: origin
    attributes:
      label: Origin (Jones categories)
      options:
        - requirements
        - design
        - coding
        - data
        - documentation
        - bad-fix
        - security
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - sev-1 (production outage)
        - sev-2 (major regression)
        - sev-3 (notable defect)
        - sev-4 (cosmetic / minor)
        - sev-5 (trivial)
    validations:
      required: true
  - type: dropdown
    id: found_by
    attributes:
      label: Found by
      options:
        - inspection
        - static-analysis
        - unit-test
        - integration-test
        - system-test
        - production
        - customer
        - ethical-hacking
        - SAST-security-rule
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: Summary
    validations:
      required: true
