# SEM-AI repo-level config — pointer for tooling.
#
# This file is what GitHub Actions, the engine MCP, and downstream consumers
# read to locate the methodology and the spine. It is intentionally minimal —
# operational config lives in instance/*.yaml.

framework_version: 0.2.0
engine_path: engine/
instance_path: instance/
spine_path: sem-ai/
adr_path: docs/adr/
tree_path: TREE.md

# GitHub conventions (mirrored in instance/instance.yaml for the engine to read).
github:
  default_branch: main
  branch_protection_recommended: true
  labels:
    feature_prefix: "feature:"
    capability_prefix: "cap:"
    story_prefix: "story:"
    spec_prefix: "spec:"
    defect_label: "type:defect"
