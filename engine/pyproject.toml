[project]
name = "sem-ai-engine"
version = "0.2.0"
description = "Methodology-blind mechanism for the SEM-AI framework. Reads instance/ YAML + markdown to validate, estimate, and walk a GitHub-backed project spine."
readme = "../README.md"
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.0",        # Model Context Protocol Python SDK
  "PyYAML>=6.0",
  "mistune>=3.0",    # markdown AST for warn-level body parsing
]

[project.scripts]
sem-ai-engine = "engine.mcp_server:main"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = [".."]
include = ["engine*"]
